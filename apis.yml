aid: chesapeake-energy
name: Chesapeake Energy
kind: company
description: >-
  Chesapeake Energy Corporation was an independent oil and natural gas
  exploration and production company headquartered in Oklahoma City,
  Oklahoma, focused on unconventional natural gas and oil fields onshore
  in the United States. In October 2024, Chesapeake combined with
  Southwestern Energy to form Expand Energy Corporation, which now
  operates as the largest natural gas producer in the United States.
  Chesapeake Energy does not currently expose a public developer API;
  royalty owners and partners interact through the Owner Online Accounts
  portal, and investors are served via the Expand Energy investor
  relations site.
